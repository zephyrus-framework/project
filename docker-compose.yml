services:
  webserver:
    image: ghcr.io/zephyrus-framework/php:8.4-dev
    container_name: "zephyrus_webserver"
    restart: 'always'
    ports:
      - "80:80"
      - "1080:1080"
    links:
      - database
    volumes:
      - ./:/var/www/html

  database:
    image: postgres:17
    container_name: ${DB_HOST}
    restart: 'always'
    ports:
      - "5432:5432"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/1-init.sql
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=fr-CA"
      TZ: America/Montreal
      PGTZ: America/Montreal
